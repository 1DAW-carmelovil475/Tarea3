<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto - La Roja</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-danger px-3">
    <a class="navbar-brand" href="index.html">🇪🇸 La Roja</a>
    <div>
      <a href="index.html" class="me-3">Inicio</a>
      <a href="articulos.html" class="me-3">Artículos</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>Contacto</h1>
    <p>¿Tienes alguna pregunta? Escríbenos.</p>
    <hr>
    <form style="max-width: 500px;">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="mcandu2504@g.educaand.es">
        </div>
        <div class="mb-3">
          <label for="mensaje" class="form-label">Mensaje</label>
          <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>
        </div>
        <button type="button" class="btn btn-danger">Enviar</button>
      </form>
  </div>

  <footer>
    <p>© 2026 La Roja Fan Site - Carmelo y Margarita</p>
  </footer>

</body>
</html>
